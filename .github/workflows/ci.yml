# zwriter CI — Linux amd64 + Apple Silicon only (no Windows / no Intel Mac).
# Version from CMake project() → PROJECT_VERSION; artifacts named like zedit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev cmake ninja-build g++ \
            unzip zip dpkg-dev \
            libhunspell-dev hunspell-en-us \
            libsodium-dev pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (ODT round-trip, regressions, updater)
        run: ctest --test-dir build --output-on-failure

      - name: EPUBCheck (whole-book EPUB export)
        run: |
          curl -sSfL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          QT_QPA_PLATFORM=offscreen ZW_EPUB_OUT="$PWD/book.epub" ./build/book_export_test > /dev/null
          java -jar epubcheck-5.4.0/epubcheck.jar --failonwarnings book.epub
          java -jar epubcheck-5.4.0/epubcheck.jar --failonwarnings book-bare.epub

      - name: Book sidebar header screenshot (offscreen)
        run: QT_QPA_PLATFORM=offscreen ZW_SHOT_DIR="$PWD/shots" ./build/book_test > /dev/null

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: zwriter-linux-screenshots
          path: shots/

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb
          # libsodium verifies the update signature (Help > Check for Updates).
          dpkg-deb -f ./*.deb Depends | grep -q libsodium23

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: zwriter-linux-amd64-deb
          path: build/*.deb
          if-no-files-found: error

  sanitizers:
    name: Linux ASan+UBSan (Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev cmake ninja-build g++ \
            unzip zip \
            libhunspell-dev hunspell-en-us \
            libsodium-dev pkg-config

      - name: Configure (Debug, -fsanitize=address,undefined)
        run: |
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test under sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
          # Leak checking is off: Qt's global singletons and plugin caches are
          # reported as leaks at exit. Memory errors and UB still fail the run.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure --timeout 1200

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt + build tools (brew)
        run: brew install qt cmake ninja hunspell libsodium pkg-config

      - name: Configure arm64
        run: |
          # CMAKE_OSX_ARCHITECTURES=arm64 is also forced in CMakeLists before project()
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test (ODT round-trip, regressions, updater)
        run: ctest --test-dir build --output-on-failure

      - name: EPUBCheck (whole-book EPUB export)
        run: |
          curl -sSfL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          QT_QPA_PLATFORM=offscreen ZW_EPUB_OUT="$PWD/book.epub" ./build/book_export_test > /dev/null
          java -jar epubcheck-5.4.0/epubcheck.jar --failonwarnings book.epub
          java -jar epubcheck-5.4.0/epubcheck.jar --failonwarnings book-bare.epub

      - name: Book sidebar header in the native macOS style (overlap test + screenshot)
        run: ZW_SHOT_DIR="$PWD/shots" ./build/book_test > /dev/null

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: zwriter-macos-screenshots
          path: shots/

      - name: Package .dmg (zwriter.app, macdeployqt, ad-hoc sign)
        run: |
          cd build
          cpack -G DragNDrop
          ls -la *.dmg

      - name: Verify .dmg contents (no Homebrew references, signature)
        run: |
          set -euo pipefail
          dmg=$(ls build/zwriter-*-Darwin.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ls -la "$mnt"
          test -d "$mnt/zwriter.app"
          test -L "$mnt/Applications"
          plutil -p "$mnt/zwriter.app/Contents/Info.plist"
          tools/macos/check-bundle.sh "$mnt/zwriter.app"
          codesign --verify --deep --strict --verbose=2 "$mnt/zwriter.app"
          codesign -dv "$mnt/zwriter.app" 2>&1 | grep -E "Identifier|Signature|Format"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: zwriter-macos-arm64-dmg
          path: build/*.dmg
          if-no-files-found: error
