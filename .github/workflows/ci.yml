# zwriter CI — Linux amd64 + Apple Silicon only (no Windows / no Intel Mac).
# Version from CMake project() → PROJECT_VERSION; artifacts named like zedit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev cmake ninja-build g++ \
            unzip zip dpkg-dev \
            libhunspell-dev hunspell-en-us

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (ODT round-trip, regressions)
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: zwriter-linux-amd64-deb
          path: build/*.deb
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt + build tools (brew)
        run: brew install qt cmake ninja hunspell

      - name: Configure arm64
        run: |
          # CMAKE_OSX_ARCHITECTURES=arm64 is also forced in CMakeLists before project()
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test (ODT round-trip, regressions)
        run: ctest --test-dir build --output-on-failure

      - name: Package .dmg (zwriter.app, macdeployqt, ad-hoc sign)
        run: |
          cd build
          cpack -G DragNDrop
          ls -la *.dmg

      - name: Verify .dmg contents (no Homebrew references, signature)
        run: |
          set -euo pipefail
          dmg=$(ls build/zwriter-*-Darwin.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ls -la "$mnt"
          test -d "$mnt/zwriter.app"
          test -L "$mnt/Applications"
          plutil -p "$mnt/zwriter.app/Contents/Info.plist"
          tools/macos/check-bundle.sh "$mnt/zwriter.app"
          codesign --verify --deep --strict --verbose=2 "$mnt/zwriter.app"
          codesign -dv "$mnt/zwriter.app" 2>&1 | grep -E "Identifier|Signature|Format"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: zwriter-macos-arm64-dmg
          path: build/*.dmg
          if-no-files-found: error
