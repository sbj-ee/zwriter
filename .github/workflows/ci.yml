# zwriter CI — Linux amd64 + Apple Silicon only (no Windows / no Intel Mac).
# Version from CMake project() → PROJECT_VERSION; artifacts named like zedit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev cmake ninja-build g++ \
            unzip zip dpkg-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwriter-linux-amd64-deb
          path: build/*.deb
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt + build tools (brew)
        run: brew install qt cmake ninja

      - name: Configure arm64
        run: |
          # CMAKE_OSX_ARCHITECTURES=arm64 is also forced in CMakeLists before project()
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Package .dmg
        run: |
          cd build
          cpack -G DragNDrop
          ls -la *.dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwriter-macos-arm64-dmg
          path: build/*.dmg
          if-no-files-found: error
